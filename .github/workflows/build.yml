name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Bundled as a build input rather than committed: it is ~80 MB and its
      # licence obliges us to ship it as an unmodified upstream binary.
      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Build installer
        run: cargo tauri build

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item target/release/FiveMClip.exe dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMClip-windows
          path: dist/*
          if-no-files-found: error

      # Tagged pushes become a public download people can point their community at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
