name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # source of truth, so CI and a developer's machine cannot drift apart.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Bundled as a build input rather than committed: it is ~80 MB and its
      # licence obliges us to ship it as an unmodified upstream binary.
      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Build installer
        run: cargo tauri build

      # --- Code signing --------------------------------------------------
      # Not enabled. Turn this on once a certificate exists; nothing else in
      # the pipeline needs to change.
      #
      # The constraint that decides the approach: a USB hardware token cannot
      # be plugged into a hosted runner, and since June 2023 every code signing
      # key must live on FIPS 140-2 hardware. So signing in CI requires a cloud
      # signing service - Azure Trusted Signing, SSL.com eSigner or DigiCert
      # KeyLocker. A plain .pfx file is no longer an option at any price.
      #
      # Azure Trusted Signing is the cheapest route. Add the secrets, uncomment,
      # and keep the timestamp URL: without timestamping every signature becomes
      # invalid the day the certificate expires, retroactively breaking
      # installers people already downloaded.
      #
      # - name: Azure login
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - name: Sign installer
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
      #     files-folder: ${{ github.workspace }}/target/release/bundle/nsis
      #     files-folder-filter: exe
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item target/release/FiveMClip.exe dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMClip-windows
          path: dist/*
          if-no-files-found: error

      # Tagged pushes become a public download people can point their community at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
