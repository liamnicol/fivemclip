name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A README edit has no business compiling Rust for ten minutes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Three pushes in five minutes should not mean three full builds: the newest
# push is the only one whose answer anyone wants.
#
# The event name is part of the group deliberately. Without it, pushing while a
# manually requested installer build is running cancels that build - and an
# installer someone asked for on purpose is not superseded by a commit landing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # source of truth, so CI and a developer's machine cannot drift apart.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Cheapest check first - it compiles nothing, so a stray tab fails in
      # seconds rather than after a full dependency build.
      - name: Check formatting
        run: cargo fmt --all --check

      # tauri-build refuses to run unless the bundled resource exists, so even
      # a lint pass needs ffmpeg on disk. Fetching it for real also means the
      # ddagrab check acts as a canary on every push.
      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  installer:
    name: Windows installer
    needs: check
    # The expensive half. Runs for releases and on demand, not for every commit
    # on main - use "Run workflow" when you want something to install and try.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Build installer
        run: cargo tauri build

      # --- Code signing --------------------------------------------------
      # Not enabled. See docs/signing.md for why this needs a cloud signing
      # service rather than a certificate file: a USB token cannot be plugged
      # into a hosted runner, and since June 2023 every code signing key must
      # live on FIPS 140-2 hardware.
      #
      # Keep the timestamp URL when enabling. Without it, signatures become
      # invalid the day the certificate expires, retroactively breaking
      # installers people have already downloaded.
      #
      # - name: Azure login
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - name: Sign installer
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
      #     files-folder: ${{ github.workspace }}/target/release/bundle/nsis
      #     files-folder-filter: exe
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The installer only. The bare target/release/FiveMClip.exe used to be
          # copied here too, which looked like a portable build and was not: it
          # ships without bin/ffmpeg.exe, so it launches and then cannot record
          # anything. See docs/architecture.md if a real portable build is ever
          # wanted.
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMClip-windows
          path: dist/*
          if-no-files-found: error

      # Tagged pushes become a public download people can point their community at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
