name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A README edit has no business compiling Rust for ten minutes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Three pushes in five minutes should not mean three full builds: the newest
# push is the only one whose answer anyone wants.
#
# The event name is part of the group deliberately. Without it, pushing while a
# manually requested installer build is running cancels that build - and an
# installer someone asked for on purpose is not superseded by a commit landing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # source of truth, so CI and a developer's machine cannot drift apart.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Cheapest check first - it compiles nothing, so a stray tab fails in
      # seconds rather than after a full dependency build.
      # A mismatch here means the installer reports one version and the binary
      # another, which only ever surfaces when someone is already confused
      # about which build they have.
      - name: Check the version is consistent
        shell: pwsh
        run: |
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tauri -ne $cargo) {
            throw "tauri.conf.json says $tauri but Cargo.toml says $cargo."
          }
          Write-Host "Version: $tauri"

      - name: Check formatting
        run: cargo fmt --all --check

      # tauri-build refuses to run unless the bundled resource exists, so even
      # a lint pass needs ffmpeg on disk. Fetching it for real also means the
      # ddagrab check acts as a canary on every push.
      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  installer:
    name: Windows installer
    needs: check
    # Creating a release writes to the repository. The default GITHUB_TOKEN is
    # read-only on repositories created since 2023, so without this the build
    # succeeds and only the publish step fails - which looks like a broken
    # release rather than a missing permission.
    permissions:
      contents: write
    # The expensive half. Runs for releases and on demand, not for every commit
    # on main - use "Run workflow" when you want something to install and try.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      # The label goes into the binary as well as the filename, so the app can
      # say which build it is. Without it every build reports 0.1.0 and there
      # is no way to tell a tester's version from a screenshot.
      - name: Compute the build label
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $label = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version
          } else {
            "$version-dev.$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_SHA.Substring(0,7))"
          }
          "FIVEMCLIP_BUILD=$label" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Build label: $label"

      # Without this the only symptom of a missing or misnamed secret is
      # "Build installer failed", which says nothing about why.
      - name: Check the signing key is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings, Secrets and variables, Actions - the name must match exactly."
          }

          # tauri signer writes the key base64-encoded, so the marker is not in
          # the file as plain text. Checking for it directly rejected a valid
          # key and cost a release cycle. Accept either form.
          $valid = $key -match 'untrusted comment'
          if (-not $valid) {
            try {
              $decoded = [Text.Encoding]::UTF8.GetString(
                [Convert]::FromBase64String($key.Trim()))
              $valid = $decoded -match 'untrusted comment'
            } catch {
              $valid = $false
            }
          }
          if (-not $valid) {
            throw "TAURI_SIGNING_PRIVATE_KEY does not look like a signing key. Paste the whole contents of the key file generated by 'tauri signer generate'."
          }
          Write-Host "Signing key present and well-formed."

      - name: Build installer
        env:
          # Updates are signed so that compromising the GitHub account is not
          # enough to push code to everyone's machine - the signature has to
          # match a key the installed app already trusts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without one, but the variable still has to
          # exist - the signer prompts interactively when it is absent, which
          # on a runner just hangs or fails.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build

      # --- Code signing --------------------------------------------------
      # Not enabled. See docs/signing.md for why this needs a cloud signing
      # service rather than a certificate file: a USB token cannot be plugged
      # into a hosted runner, and since June 2023 every code signing key must
      # live on FIPS 140-2 hardware.
      #
      # Keep the timestamp URL when enabling. Without it, signatures become
      # invalid the day the certificate expires, retroactively breaking
      # installers people have already downloaded.
      #
      # - name: Azure login
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - name: Sign installer
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
      #     files-folder: ${{ github.workspace }}/target/release/bundle/nsis
      #     files-folder-filter: exe
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      - name: Collect artefacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version

          # Same label the binary was compiled with, so the filename and what
          # the app reports in Settings can never disagree.
          $label = $env:FIVEMCLIP_BUILD
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
              if ($tag -ne $version) {
                  throw "Tag v$tag does not match the version in tauri.conf.json ($version). Bump the version before tagging."
              }
          }
          Write-Host "Build label: $label"

          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "dist/FiveMClip-$label-setup.exe"

          # Portable build: the same binary, plus the pieces the installer
          # would otherwise have provided. The marker file is what puts the app
          # into portable mode - see crates/capture/src/config.rs.
          $staging = "staging/FiveMClip"
          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          Copy-Item target/release/FiveMClip.exe "$staging/"
          Copy-Item src-tauri/bin/ffmpeg.exe "$staging/bin/"
          Copy-Item LICENSE, THIRD-PARTY.md "$staging/"
          # Names must differ by more than case: NTFS treats PORTABLE.txt and
          # portable.txt as the same file, so the two copies would collapse
          # into one and the zip would ship without its marker.
          Copy-Item tools/portable/README-PORTABLE.txt "$staging/"
          Copy-Item tools/portable/portable.txt "$staging/"

          # The folder, not its contents: zipping "$staging/*" produces an
          # archive with no wrapper, so "extract here" scatters the marker file
          # and turns whatever folder they extracted into the portable root.
          Compress-Archive -Path $staging -DestinationPath "dist/FiveMClip-$label-portable.zip" -Force

          # The update manifest. Only written for tagged builds: pointing the
          # updater at a dev build would push unreleased code to everyone.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $signature = Get-ChildItem target/release/bundle/nsis/*.exe.sig |
                  Select-Object -First 1
              if (-not $signature) {
                  throw "No .sig file. createUpdaterArtifacts is off, or TAURI_SIGNING_PRIVATE_KEY is not set."
              }

              $manifest = [ordered]@{
                  version   = $label
                  notes     = "See the release notes at https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$label"
                  pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                  platforms = [ordered]@{
                      "windows-x86_64" = [ordered]@{
                          signature = (Get-Content $signature.FullName -Raw).Trim()
                          # Must be the renamed asset, not what the bundler
                          # produced, or the updater downloads a 404.
                          url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$label/FiveMClip-$label-setup.exe"
                      }
                  }
              }
              $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/latest.json -Encoding utf8
              Write-Host "Wrote dist/latest.json"
          }

          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMClip-windows
          path: dist/*
          if-no-files-found: error

      # The updater reads https://github.com/OWNER/REPO/releases/latest/download/latest.json,
      # and GitHub decides "latest" by publish date rather than by version. So
      # publishing an older tag after a newer one silently repoints every
      # installed copy at the older manifest - which, being a lower version than
      # they are running, reads to the updater as "you are up to date, for ever".
      #
      # Refuse rather than discover that from a user who stopped getting updates.
      - name: Refuse to publish behind the current latest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent"  = "fivemclip-ci"
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          try {
              $current = (Invoke-RestMethod -Uri $url -Headers $headers).tag_name -replace '^v', ''
          } catch {
              # No releases yet, which is the one case where there is nothing to
              # be behind.
              Write-Host "No published release yet; $tag is the first."
              exit 0
          }
          Write-Host "Publishing $tag; currently published latest is $current."
          if ([version]$tag -le [version]$current) {
              throw "Refusing to publish $tag on top of $current. The updater follows " +
                    "GitHub's latest release, so this would point every installed copy " +
                    "at an older manifest and stop them updating. Tag a higher version."
          }

      # Tagged pushes become a public download people can point their community at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
