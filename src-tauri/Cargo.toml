[package]
name = "fivemclip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first clip recorder and screenshot tool for FiveM"
default-run = "fivemclip"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fivemclip-capture = { path = "../crates/capture" }
# devtools in release too: a user hitting a blank window needs to be able to
# right-click and read the console, which is the whole diagnosis.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "devtools"] }
# Two copies share a ring folder and segment names, so the second one corrupts
# the first one's footage. This is a correctness dependency, not a nicety.
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Needed to restart into the new version once an update is applied.
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = "0.4"
# The editor hands back a finished PNG; base64 keeps that transfer boring.
base64 = "0.22"
# native-tls resolves to schannel on Windows: the OS trust store, no bundled
# root certificates to go stale, and no C toolchain in the build.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }
tokio = { version = "1", features = ["fs"] }
