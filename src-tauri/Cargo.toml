[package]
name = "fivemclip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first clip recorder and screenshot tool for FiveM"
default-run = "fivemclip"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fivemclip-capture = { path = "../crates/capture" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = "0.4"
# native-tls resolves to schannel on Windows: the OS trust store, no bundled
# root certificates to go stale, and no C toolchain in the build.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }
tokio = { version = "1", features = ["fs"] }
